# Allowlist proxy for agent-example. Full config (not a conf.d fragment) so nothing is inherited implicitly.
# Deny by default: only CONNECT to the domains below on 443. Plain HTTP is denied.
# Every host you add is an egress path for the agent. Add one at a time, with a written reason.

http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT

# Model endpoint.
acl allowed_hosts dstdomain api.anthropic.com
# Slack Socket Mode: Web API on slack.com, WebSocket hosts rotate (wss.slack.com, wss-*.slack.com, applink-*).
# No official allowlist exists; ".slack.com" is broad (also other workspaces' subdomains). Tighten from the access log.
acl allowed_hosts dstdomain .slack.com
# GitHub over HTTPS only (git smart-HTTP on github.com, PR API on api.github.com); no SSH. Confirm with a real clone/push.
acl allowed_hosts dstdomain github.com api.github.com
# CI job logs (gh run view --log / --log-failed): api.github.com redirects to signed, short-lived URLs on this host.
# Exact host only. Do NOT add generic blob storage (*.blob.core.windows.net) if logs redirect there: it accepts
# uploads with any key and would be an exfiltration path.
acl allowed_hosts dstdomain results-receiver.actions.githubusercontent.com

# Examples, disabled. Prefer an exact host (no leading dot, so no subdomains) over a wildcard.
# acl allowed_hosts dstdomain www.example.com                # read-only audits of your own site (curl)
# acl allowed_hosts dstdomain registry.npmjs.org             # only if installs are required
# acl allowed_hosts dstdomain pypi.org files.pythonhosted.org
# A regex ACL cannot share a name with a dstdomain ACL, so it needs its own name and its own http_access rule:
# acl allowed_previews dstdom_regex -i ^[a-z0-9-]+-your-site\.your-account\.workers\.dev$
# http_access allow CONNECT SSL_ports allowed_previews

http_access allow CONNECT SSL_ports allowed_hosts
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /tmp/squid.pid
# Docker's default nofile limit is ~1e9; squid sizes its fd table from it and dies (xcalloc). One agent needs few.
max_filedescriptors 4096
# ICMP pinger needs NET_RAW, which cap_drop ALL removes on purpose.
pinger_enable off
forwarded_for delete
via off
